{% extends 'base.html' %}

{% block content %}

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#6dd5ed,#2193b0,#6a11cb);
    min-height:100vh;
}

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:40px;
}

.card{
    width:100%;
    max-width:700px;
    background:#fff;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,.2);
    overflow:hidden;
    animation:fadeIn .7s ease;
}

.header{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:30px;
}

.header h2{
    font-size:32px;
}

.header p{
    margin-top:8px;
    opacity:.9;
}

.form-body{
    padding:35px;
}

form p{
    margin-bottom:20px;
}

form label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#333;
}

form input,
form select,
form textarea{
    width:100%;
    padding:12px;
    border:1px solid #ced4da;
    border-radius:10px;
    font-size:16px;
    transition:.3s;
}

form input:focus,
form select:focus,
form textarea:focus{
    border-color:#0d6efd;
    outline:none;
    box-shadow:0 0 8px rgba(13,110,253,.3);
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:30px;
    flex-wrap:wrap;
}

.btn{
    text-decoration:none;
}

.btn button{
    border:none;
    padding:14px 28px;
    border-radius:30px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
    transition:.3s;
}

.update{
    background:#198754;
    color:white;
}

.update:hover{
    background:#157347;
    transform:translateY(-3px);
}

.cancel{
    background:#6c757d;
    color:white;
}

.cancel:hover{
    background:#5c636a;
    transform:translateY(-3px);
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:768px){

.card{
width:100%;
}

.buttons{
flex-direction:column;
}

.btn button{
width:100%;
}

}

</style>

<div class="container">

<div class="card">

<div class="header">

<h2>✏️ Update Appointment</h2>

<p>Edit the appointment details below.</p>

</div>

<div class="form-body">

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<div class="buttons">

<button type="submit" class="update">
💾 Save Changes
</button>

<a href="{% url 'appointment_list' %}" class="btn">
<button type="button" class="cancel">
❌ Cancel
</button>
</a>

</div>

</form>

</div>

</div>

</div>

{% endblock %}
