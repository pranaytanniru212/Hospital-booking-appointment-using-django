{% extends 'base.html' %}

{% block content %}

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#74ebd5,#ACB6E5);
    min-height:100vh;
}

/* Container */

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:40px;
}

/* Card */

.form-card{
    width:100%;
    max-width:650px;
    background:rgba(255,255,255,.95);
    border-radius:20px;
    padding:40px;
    box-shadow:0 20px 40px rgba(0,0,0,.2);
    animation:fadeIn .8s ease;
}

/* Heading */

.form-card h2{
    text-align:center;
    color:#0d6efd;
    margin-bottom:10px;
    font-size:34px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:35px;
}

/* Django Form */

form p{
    margin-bottom:20px;
}

form label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#333;
}

form input,
form select,
form textarea{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    transition:.3s;
    outline:none;
}

form input:focus,
form select:focus,
form textarea:focus{
    border-color:#0d6efd;
    box-shadow:0 0 10px rgba(13,110,253,.25);
}

/* Submit Button */

.submit-btn{
    width:100%;
    padding:15px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.submit-btn:hover{
    background:#0b5ed7;
    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(13,110,253,.3);
}

/* Back Button */

.back-btn{
    display:block;
    text-align:center;
    margin-top:20px;
    text-decoration:none;
    color:#0d6efd;
    font-weight:bold;
    transition:.3s;
}

.back-btn:hover{
    color:#084298;
}

/* Animation */

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* Responsive */

@media(max-width:768px){

.form-card{
padding:25px;
}

.form-card h2{
font-size:28px;
}

}

</style>

<div class="container">

    <div class="form-card">

        <h2>🏥 Book Appointment</h2>

        <p class="subtitle">
            Fill in the details below to schedule your appointment.
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="submit-btn">
                📅 Confirm Appointment
            </button>

        </form>

        <a href="{% url 'home' %}" class="back-btn">
            ← Back to Home
        </a>

    </div>

</div>

{% endblock %}
